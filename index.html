
<!DOCTYPE html>
<html>
<head>
    <title>Sign Up Page</title>
    <style>
        body {
            font-family: Arial;
            background-color: lightblue;
            text-align: center;
        }

        .container {
            background: white;
            width: 300px;
            margin: 100px auto;
            padding: 25px;
            border-radius: 10px;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 10px;
        }

        button {
            background-color: blue;
            color: white;
            padding: 10px 30px;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Sign Up</h2>

        <form>
            <input type="text" placeholder="Enter Name" required><br>

            <input type="email" placeholder="Enter Email" required><br>

            <input type="password" placeholder="Enter Password" required><br>

            <button type="submit">Sign Up</button>
        </form>
    </div>

</body>
</html>
